# Elenvind 日志轮转示例
#
#   sudo cp deploy/logrotate.conf /etc/logrotate.d/elenvind
#   sudo logrotate -d /etc/logrotate.d/elenvind     # 干跑校验
#
# 为什么应用不再自己轮转（[logging].rotate = false 是默认值）：
# Gunicorn 每个 worker 都是一个独立进程，各自持有一个 RotatingFileHandler；
# 多个进程同时 rotate 会互相截断，极端情况下丢行。改用
# logging.handlers.WatchedFileHandler 之后，应用会在每次写日志前检查 inode，
# 发现文件被轮转就自动重新打开——因此这里**不需要** copytruncate。

/srv/elenvind/logs/app.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    create 0640 elenvind elenvind
    sharedscripts
    postrotate
        # WatchedFileHandler 会自动重开文件，这里不需要给应用发信号。
        # 如果你把 [logging].rotate 改成了 true（应用内轮转），请删掉本文件，
        # 或者在轮转后重启服务：systemctl reload elenvind
    endscript
}
