locale = "zh"
title = "Elenvind"
copyright = "Elenvind"
keywords = ["a", "b"]
description = "A Personal Website Server"

# 站点对外地址：robots.txt / sitemap.xml 里所有绝对 URL 的唯一来源。
# 绝不从请求的 Host 头推导（Host 由客户端控制，会造成 Host 头投毒）。
# 留空则这些文件不输出绝对地址；填了必须是不带结尾斜杠的 http(s) 绝对地址。
site_url = "https://ortzikantu.com"

# 管理员账号 id：可删除/恢复任意评论（不再硬编码为 1）。
# 缺失或非法时视为"无管理员"，不会静默把权限给 id=1。
admin_user_id = 1

admin_badge = ""   # 管理员徽章文字（admin_user_id 用户昵称旁）；留空彻底不显示，缺失时默认 "BIG BOSS"
deleted_user_nickname = "已远行"
max_length = 1000   # 单条评论最大长度（字符）：textarea 与后端双重限制
max_comment_depth = 32             # 评论最大层级（顶层 = 1）；**硬约束**：写入侧在事务内校验，超层回复被拒
max_comments_per_article = 1000    # 单篇文章评论总数上限

registration_enabled = true        # 是否开放公开注册

###################################################################################################
# 服务端会话过期（两个维度都要满足会话才有效；任一超时即失效并当场删除该会话）
#
# 绝对过期：会话创建后活够这么多天就必须重新登录。与活跃程度无关，
#           这是"token 泄露后风险窗口"的硬上限。
# 滑动过期：闲置超过这么多天即失效；有效访问会刷新 last_seen，
#           所以常用设备不会被踢，只是长期不用的会话会自然消失。
#
# 设为 0 = 该维度**不过期**。⚠️ 两个都设 0 等于回到"永久有效"：
# token 一旦泄露，攻击者可以无限期使用。除非你完全清楚代价，否则别这么写。
#
# 两者都超过 10 年（3650 天）会被启动校验拒绝（那基本等于不想过期，请显式写 0）。
###################################################################################################
session_absolute_days = 30         # 绝对过期：30 天（默认）
session_idle_days = 15             # 滑动过期：15 天不活跃即失效（默认）

max_body_size = 1048576            # POST 表单体积上限（1 MB），超出返回 413
database = "sqlite.db"             # 相对项目根；也可用环境变量 ELENVIND_DB 覆盖
articles_dir = "articles"          # 文章目录（相对项目根）
custom_pages_dir = "custom_pages"      # 自定义页面目录（相对项目根）
templates_dir = "elenvind/templates"  # Jinja2 模板目录（相对项目根）

# 内置样式表回落：当 [static].css 为空时，是否使用应用自带的样式表
# （/css/style.css，由应用自己发出，不依赖 Nginx）。
#   true （默认）：配置为空 -> 用内置样式，站点不会变成裸 HTML
#   false        ：配置为空 -> 不输出 <link>，完全由你掌控样式
use_builtin_css = true

# 安全响应头（Core 统一注入，模块不感知）见文件末尾的 [security]：
# TOML 的表会"吃掉"它之后的所有顶层键，所以所有表都必须排在这些顶层键之后。

[server]
    host = "0.0.0.0"
    port = 6789
    # Gunicorn worker 进程数（`python run.py` 会读它；也可用 --workers 覆盖）。
    # 2 是出厂值：多 worker 是设计的一部分。所有写事务经过 Core 的 write_tx()
    # （flock 跨进程排他 + BEGIN IMMEDIATE），写是串行的，读不会被写阻塞。
    workers = 2
    # 受信代理列表（唯一来源）：仅当直连对端在此列表中时，才采信
    # X-Forwarded-For（客户端 IP）与 X-Forwarded-Proto（https 判定），
    # 防伪造绕过登录限流、骗到 Secure Cookie/HSTS。nginx 反代场景保持回环
    # 默认即可；若代理与本站不在同一台机器，请改为代理的实际地址。
    trusted_proxies = ["127.0.0.1", "::1"]
    # 给会话/CSRF Cookie 加 __Host- 前缀（要求全程 HTTPS + Path=/ + 无 Domain）。
    # 仅在站点确定只能通过 HTTPS 访问时开启。
    cookie_prefix = false

[pagination]
    per_page = 6

[comment_limits]
    max_per_user = 5        # 窗口内单用户最多评论数
    max_per_ip = 10         # 窗口内单 IP 最多评论数
    window_seconds = 60

[login_limits]
    max_email_failures = 5      # 单邮箱失败上限（主防线）
    email_window_seconds = 86400
    max_ip_failures = 20        # 单 IP 失败上限（辅助防线）
    ip_window_seconds = 900
    max_global_failures = 200   # 全站失败上限（分布式爆破闸门）
    global_window_seconds = 900

[register_limits]
    max_per_ip = 5          # 注册 IP 限流：窗口内最多注册尝试次数
    window_seconds = 3600

[static]
    # 全站样式表。
    # 留空 -> 由上面的 use_builtin_css 决定：true 用应用缺省样式表
    #        （/css/style.css），false 则完全不加载样式。
    # 填值 -> 用你指定的地址。注意这个地址由**你的 Web 服务器**负责提供
    #        （应用只发内置样式表，不托管任意静态文件），例如
    #        "/static/site.css" 或 "https://cdn.example.com/site.css"。
    # 想自定义外观：拿仓库根的 style.example.css 改好放到 Nginx，再把地址填这里。
    css = ""

    # 站点图标；留空则回落到包内缺省图标（elenvind/static/imgs/）。
    # 填 URL 时优先用你的（由你的 Web 服务器提供）。
    favicon = "/imgs/favicon.ico"

    # 页头站标图标（与站名并排）；留空依次回退：配置的 favicon -> 缺省图标
    logo = "/imgs/logo.png"

    # 首页 Hero 大图；留空则整块 hero 区不渲染
    hero = "https://raw.githubusercontent.com/ortzikantu/homepage/refs/heads/trunk/assets/assets/imgs/hero.jpg"

[params]
  intro = "Hey there! 👋 很高兴在这里与你相遇。🌟お幸せに~"

###################################################################################################

  [[params.nav]]
    name = "About"
    url = "/about"
  [[params.nav]]
    name = "Statement"
    url = "/statement"

###################################################################################################

  # 社交链接：icon 留空则退化为显示名称文字（仓库不附带图标文件）。
  # 放好自己的 SVG/PNG 后填 URL，例如 icon = "/static/codeberg.svg"
  [[params.social]]
    name = "Codeberg"
    url = "https://codeberg.org/"
    icon = "/imgs/codeberg.svg"
  [[params.social]]
    name = "Github"
    url = "https://github.com/"
    icon = "/imgs/github.svg"
  
###################################################################################################

  [[params.projects]]
    name = "Elenvind"
    url = "https://github.com/ortzikantu/elenvind"
    description = "本站运行的基石，仅用 Python 标准库、SQLite、Gunicorn（WSGI）构建的博客。"

###################################################################################################

[logging]
    level = "info"               # 可选值：debug, info, warning, error, critical
    file = "logs/app.log"        # 日志文件路径（相对项目根目录）
    max_bytes = 10485760         # 10 MB
    backup_count = 5

###################################################################################################
# 安全响应头（Core 在响应收尾阶段统一注入，模块层不感知）
#
# 默认值已经够用；这里把关键项显式写出来，方便按需调整。
# 整节删掉也能正常启动（走代码内默认值）。
#
# 注意：TOML 的表会"吃掉"它之后的所有顶层键，因此本文件把所有
# [table] 都排在前面的顶层键之后。
###################################################################################################

[security]
csp_enabled = true                 # false = 完全不下发 CSP（不推荐）
# 留空字符串 = 不下发该头
permissions_policy = "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=(), interest-cohort=()"

# HSTS：开启后**仅 HTTPS 请求**才下发。
# 若 [server].cookie_prefix = true（__Host- 前缀要求全程 HTTPS），留空即视为启用。
hsts_enabled = true
hsts_max_age = 31536000            # 秒；首次上线建议先用 300 确认无误再调大
hsts_include_subdomains = false    # 子域全部支持 HTTPS 后再开

# CSP 指令覆盖：只写要改的条目，其余用默认值。
# 默认：script-src 'none'（本站 Zero-JS）、style-src 'self' 'unsafe-inline'
#       （'unsafe-inline' 是首页 hero 的 style 属性所需，**别删**，
#        删掉会让 hero 图静默失效并刷 style-src-elem 报错）、
#       default-src 'self'、object-src / base-uri / frame-ancestors 'none'。
[security.csp]
# 现用外链图片（hero 托管在 GitHub），因此保留 http/https 通配；
# 若把图片全部收进站内（elenvind/static/imgs/），可收紧成 ["'self'", "data:"]。
img-src = ["'self'", "data:", "http:", "https:"]
# 视频同理：@video(url) 支持外部地址
media-src = ["'self'", "http:", "https:"]

