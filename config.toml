locale = "zh"
title = "Elenvind"
copyright = "Elenvind"
keywords = ["a", "b"]
description = "A Personal Website Server"

admin_badge = ""   # 管理员徽章文字（id=1 用户昵称旁）；留空彻底不显示，缺失时默认 "BIG BOSS"
deleted_user_nickname = "已远行"
max_length = 1000   # 单条评论最大长度（字符）：textarea 与后端双重限制

[server]
    host = "0.0.0.0"
    port = 6789
    # 受信代理列表（用于解析 X-Forwarded-For 客户端 IP）：仅当直连对端在此
    # 列表中时才信任转发头，防伪造绕过登录限流。nginx 反代场景保持回环默认即可；
    # 若代理与本站不在同一台机器，请改为代理的实际地址。
    trusted_proxies = ["127.0.0.1", "::1"]

[pagination]
    per_page = 6

[static]
    # 全站样式表；留空回退 /style.css
    css = "http://192.168.1.182/static/style.css"

    # 站点图标；留空回退 /favicon.ico
    favicon = "http://192.168.1.182/static/favicon.ico"

    # 首页Hero大图
    hero = "https://ortzikantu.com/assets/imgs/hero_hu_a43a6d82c671954c.webp"

[params]
  author = "Genius"
  intro = "Hey there! 👋 很高兴在这里与你相遇。🌟お幸せに~"

###################################################################################################

  [[params.nav]]
    name = "About"
    url = "/about"
  [[params.nav]]
    name = "Statement"
    url = "/statement"

###################################################################################################

  [[params.social]]
    name = "Codeberg"
    url = "https://codeberg.org/"
    icon = "http://192.168.1.182/static/codeberg.svg"
  [[params.social]]
    name = "Github"
    url = "https://github.com/"
    icon = "http://192.168.1.182/static/github.svg"
  
###################################################################################################

  [[params.projects]]
    name = "Elenvind"
    url = "https://github.com/ortzikantu/elenvind"
    description = "本站运行的基石，仅用 Python 标准库、SQLite 与 uvicorn 构建的博客。"

###################################################################################################

[logging]
    level = "info"               # 可选值：debug, info, warning, error, critical
    file = "logs/app.log"        # 日志文件路径（相对项目根目录）
    max_bytes = 10485760         # 10 MB
    backup_count = 5
